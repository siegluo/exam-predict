# 完整项目 docker-compose
# 包含：基础设施 + Java API + Python API + Nginx 网关

services:
  # ========== 基础设施 ==========

  postgres:
    image: postgres:16-alpine
    container_name: exam-postgres
    environment:
      POSTGRES_DB: exampred
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: exam-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  neo4j:
    image: neo4j:5.18-community
    container_name: exam-neo4j
    environment:
      NEO4J_AUTH: 'neo4j/Exampred123'
      NEO4J_PLUGINS: '["apoc"]'
    entrypoint: ""
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: exam-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}  # ⚠️ 禁止使用 minioadmin 生产环境密码
    entrypoint: |
      bash -c 'if echo "${MINIO_SECRET_KEY}" | grep -qE "^(minioadmin|admin|password|password123|root)$"; then echo "FATAL: MINIO_SECRET_KEY must not be a weak default value. Set a strong password in .env"; exit 1; fi; /usr/bin/docker-entrypoint.sh minio server /data --console-address ":9001"'
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: exam-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    restart: unless-stopped

  # ========== 项目服务 ==========

  java-api:
    image: deploy-java-api:latest
    container_name: exam-java-api
    ports:
      - "8082:8080"
      - "8080:8080"
    env_file:
      - ../.env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/exampred
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - JWT_SECRET_KEY=exam-prediction-secret-key-2026-very-strong-random-string-32chars
      - JWT_EXPIRATION=86400000
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - APP_TEST_MODE=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  python-api:
    image: deploy-python-api:latest
    container_name: exam-python-api
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - NEO4J_URI=bolt://exam-neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}  # ⚠️ 禁止使用默认值，必须从 .env 读取
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@postgres:5432/exampred
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Next.js Frontend
  frontend:
    image: exam-frontend:local
    container_name: exam-frontend
    ports:
      - "3000:3000"
    environment:
      - PYTHON_API_URL=http://python-api:8000
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: exam-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf.live:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot
    depends_on:
      - java-api
      - python-api
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  minio_data:
